<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowIQ — AI-Powered Adaptive Traffic & Transit</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
              900: '#134e4a',
              950: '#042f2e',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #0d9488; }
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.5);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.4);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.4); opacity: 0.3; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }
    .pulse-effect {
      animation: pulse-ring 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-[#090d16] text-slate-100 antialiased font-sans overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- MOCK DATA ---
    const INITIAL_JUNCTIONS = [
      { id: 'J-101', name: 'Connaught Circle / Central Ring', status: 'low', density: 34, vehicleCount: 142, avgSpeed: 42, waitTime: 18, x: 25, y: 35 },
      { id: 'J-204', name: 'Tech Corridor - North Hub', status: 'severe', density: 89, vehicleCount: 480, avgSpeed: 11, waitTime: 82, x: 65, y: 25 },
      { id: 'J-309', name: 'Metro Flyover Junction', status: 'moderate', density: 62, vehicleCount: 290, avgSpeed: 24, waitTime: 45, x: 45, y: 55 },
      { id: 'J-108', name: 'Old City Outer Gate', status: 'low', density: 28, vehicleCount: 115, avgSpeed: 48, waitTime: 14, x: 80, y: 70 },
      { id: 'J-502', name: 'IT Park Expressway Ramp', status: 'moderate', density: 68, vehicleCount: 340, avgSpeed: 21, waitTime: 52, x: 30, y: 75 },
    ];

    const INITIAL_BUSES = [
      { id: 'BUS-401', line: 'Route 12B (Express)', headingJunction: 'J-204', eta: '4 min', delay: '+6 min', load: '84%', priorityActive: false },
      { id: 'BUS-108', line: 'Route 44 (Metro Feeder)', headingJunction: 'J-101', eta: '2 min', delay: 'On Time', load: '45%', priorityActive: false },
      { id: 'BUS-302', line: 'Route 9A (Outer Ring)', headingJunction: 'J-309', eta: '5 min', delay: '+2 min', load: '62%', priorityActive: false },
      { id: 'BUS-512', line: 'Route 101 (Airport Shuttle)', headingJunction: 'J-502', eta: '7 min', delay: '+9 min', load: '92%', priorityActive: true },
    ];

    const ALERTS_DATA = [
      { id: 1, time: '2 mins ago', junction: 'J-204 (Tech Corridor)', type: 'Severe Congestion', msg: 'Vehicle queue exceeded 350 meters on Northbound ramp.', status: 'critical' },
      { id: 2, time: '5 mins ago', junction: 'J-502 (IT Park Ramp)', type: 'Flow Slowdown', msg: 'Average speed dropped by 45% due to bottleneck.', status: 'warning' },
      { id: 3, time: '12 mins ago', junction: 'J-204', type: 'Bus Priority Active', msg: 'BUS-401 requesting priority green window extension.', status: 'info' }
    ];

    const getStatusBg = (status) => {
      switch(status) {
        case 'severe': return 'bg-rose-500/20 text-rose-400 border-rose-500/40';
        case 'moderate': return 'bg-amber-500/20 text-amber-400 border-amber-500/40';
        default: return 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40';
      }
    };

    const getStatusHex = (status) => {
      switch(status) {
        case 'severe': return '#ef4444';
        case 'moderate': return '#f59e0b';
        default: return '#10b981';
      }
    };

    // --- MAIN APP ---
    function App() {
      const [activeTab, setActiveTab] = useState('landing');
      const [junctions, setJunctions] = useState(INITIAL_JUNCTIONS);
      const [buses, setBuses] = useState(INITIAL_BUSES);
      const [alerts, setAlerts] = useState(ALERTS_DATA);
      const [isSurgeActive, setIsSurgeActive] = useState(false);
      const [aiSignalApplied, setAiSignalApplied] = useState(false);
      const [currentTime, setCurrentTime] = useState(new Date());

      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        const simInterval = setInterval(() => {
          setJunctions(prev => prev.map(j => {
            const delta = Math.floor(Math.random() * 7) - 3;
            const newCount = Math.max(30, j.vehicleCount + delta);
            return {
              ...j,
              vehicleCount: newCount,
              density: Math.min(99, Math.max(10, Math.round(newCount / 5)))
            };
          }));
        }, 3000);
        return () => clearInterval(simInterval);
      }, []);

      const triggerTrafficSurge = () => {
        setIsSurgeActive(true);
        setJunctions(prev => prev.map(j => {
          if (j.id === 'J-204') {
            return { ...j, status: 'severe', density: 96, vehicleCount: 610, avgSpeed: 7, waitTime: 110 };
          }
          if (j.id === 'J-309') {
            return { ...j, status: 'severe', density: 84, vehicleCount: 420, avgSpeed: 12, waitTime: 75 };
          }
          return j;
        }));

        setAlerts(prev => [{
          id: Date.now(),
          time: 'Just now',
          junction: 'J-204 Corridor',
          type: 'SURGE SIMULATED',
          msg: 'Traffic surge detected! Dynamic signal adaptation triggered.',
          status: 'critical'
        }, ...prev]);

        setTimeout(() => setActiveTab('ai-control'), 1000);
      };

      const resetSurge = () => {
        setIsSurgeActive(false);
        setAiSignalApplied(false);
        setJunctions(INITIAL_JUNCTIONS);
      };

      const applyAiOptimization = () => {
        setAiSignalApplied(true);
        setJunctions(prev => prev.map(j => {
          if (j.id === 'J-204') {
            return { ...j, status: 'moderate', density: 54, avgSpeed: 28, waitTime: 32 };
          }
          return j;
        }));
      };

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      return (
        <div className="min-h-screen flex flex-col bg-[#090d16] text-slate-100 font-sans">
          
          {/* HEADER */}
          <header className="h-16 border-b border-slate-800 bg-[#090d16]/90 backdrop-blur-md sticky top-0 z-50 flex items-center justify-between px-4 md:px-6">
            <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('landing')}>
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-600 to-cyan-400 flex items-center justify-center shadow-lg shadow-teal-500/20">
                <i data-lucide="cpu" className="w-6 h-6 text-slate-950 font-bold"></i>
              </div>
              <div>
                <span className="text-xl font-extrabold tracking-wider bg-gradient-to-r from-teal-400 via-cyan-300 to-emerald-400 bg-clip-text text-transparent">
                  FlowIQ
                </span>
                <span className="hidden sm:inline-block text-[10px] ml-2 px-2 py-0.5 rounded bg-teal-950 text-teal-300 border border-teal-800 font-mono">
                  SIH 2026 PROTOTYPE
                </span>
              </div>
            </div>

            <div className="flex items-center space-x-3 md:space-x-6">
              <div className="hidden lg:flex items-center space-x-2 text-xs font-mono bg-slate-900/80 px-3 py-1.5 rounded-lg border border-slate-800">
                <span className="relative flex h-2 w-2">
                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <span className="text-slate-400">AI ENGINE:</span>
                <span className="text-emerald-400 font-semibold">ONLINE</span>
              </div>

              <button
                onClick={isSurgeActive ? resetSurge : triggerTrafficSurge}
                className={`flex items-center space-x-2 text-xs font-bold px-3.5 py-2 rounded-lg transition-all duration-200 border ${
                  isSurgeActive 
                    ? 'bg-rose-950/80 text-rose-300 border-rose-700' 
                    : 'bg-gradient-to-r from-amber-500 to-orange-600 text-slate-950 border-amber-400 shadow-lg shadow-orange-500/20'
                }`}
              >
                <i data-lucide={isSurgeActive ? "rotate-ccw" : "zap"} className="w-4 h-4"></i>
                <span>{isSurgeActive ? 'Reset Simulation' : '⚡ SIMULATE TRAFFIC SURGE'}</span>
              </button>
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <div className="flex flex-1 overflow-hidden">
            
            {/* SIDE NAVIGATION */}
            <aside className="w-16 md:w-64 border-r border-slate-800/80 bg-[#0c121e]/80 flex flex-col justify-between py-4 flex-shrink-0">
              <nav className="space-y-1 px-2">
                {[
                  { id: 'landing', label: 'Overview Portal', icon: 'layout' },
                  { id: 'live-dashboard', label: 'Live Traffic Control', icon: 'map-pin' },
                  { id: 'ai-control', label: 'AI Adaptive Signal', icon: 'sliders' },
                  { id: 'bus-priority', label: 'Bus Priority Hub', icon: 'bus' },
                  { id: 'route-opt', label: 'Route Optimization', icon: 'git-branch' },
                  { id: 'citizen-view', label: 'Citizen View', icon: 'smartphone' },
                  { id: 'analytics', label: 'Analytics', icon: 'bar-chart-3' },
                ].map((item) => {
                  const isActive = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setActiveTab(item.id)}
                      className={`w-full flex items-center space-x-3 px-3 py-3 rounded-xl text-xs md:text-sm font-medium transition-all ${
                        isActive
                          ? 'bg-teal-500/15 text-teal-300 border border-teal-500/30'
                          : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'
                      }`}
                    >
                      <i data-lucide={item.icon} className={`w-5 h-5 ${isActive ? 'text-teal-400' : 'text-slate-400'}`}></i>
                      <span className="hidden md:inline">{item.label}</span>
                    </button>
                  );
                })}
              </nav>
            </aside>

            {/* PAGE CONTENT */}
            <main className="flex-1 overflow-y-auto p-4 md:p-6 bg-gradient-to-b from-[#090d16] to-[#0d1322]">
              
              {/* PAGE 1: OVERVIEW */}
              {activeTab === 'landing' && (
                <div className="space-y-8 max-w-7xl mx-auto">
                  <div className="relative rounded-3xl glass-panel p-8 md:p-12 overflow-hidden border border-slate-700/50">
                    <div className="max-w-3xl space-y-6">
                      <div className="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-teal-500/10 border border-teal-500/30 text-teal-300 text-xs font-semibold">
                        <i data-lucide="sparkles" className="w-3.5 h-3.5"></i>
                        <span>Smart India Hackathon 2026 Core Prototype</span>
                      </div>
                      <h1 className="text-4xl md:text-6xl font-black text-white leading-tight">
                        Smarter Traffic. <br />
                        <span className="bg-gradient-to-r from-teal-400 to-emerald-400 bg-clip-text text-transparent">
                          Faster Cities.
                        </span>
                      </h1>
                      <p className="text-slate-300 text-base md:text-lg">
                        FlowIQ uses AI video analytics, IoT density sensing, and bus GPS tracking to optimize traffic signals dynamically and prioritize public transit.
                      </p>
                      <div className="flex gap-4">
                        <button onClick={() => setActiveTab('live-dashboard')} className="px-6 py-3.5 rounded-xl bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold flex items-center space-x-2">
                          <i data-lucide="activity" className="w-5 h-5"></i>
                          <span>Launch Live Dashboard</span>
                        </button>
                      </div>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                    {[
                      { title: 'Junctions Monitored', val: '128' },
                      { title: 'Buses Tracked', val: '450+' },
                      { title: 'Avg Delay Reduced', val: '28.4%' },
                      { title: 'CO2 Saved', val: '14.2 Tons' }
                    ].map((stat, i) => (
                      <div key={i} className="glass-card p-5 rounded-2xl border border-slate-800">
                        <div className="text-xs text-slate-400">{stat.title}</div>
                        <div className="text-2xl md:text-3xl font-black text-white mt-1">{stat.val}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* PAGE 2: LIVE CONTROL MAP */}
              {activeTab === 'live-dashboard' && (
                <div className="space-y-6">
                  <div className="flex justify-between items-center">
                    <div>
                      <h2 className="text-2xl font-bold text-white">Live Operations Command Map</h2>
                      <p className="text-xs text-slate-400">Real-time vector topology of city traffic junctions</p>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    {/* SVG Map Container */}
                    <div className="lg:col-span-2 glass-panel p-4 rounded-2xl border border-slate-800 h-[500px] relative flex flex-col justify-between">
                      <div className="text-xs font-semibold text-slate-400 flex justify-between">
                        <span>VECTOR CITY JUNCTION MAP</span>
                        <span className="text-teal-400">Live Traffic Telemetry</span>
                      </div>

                      <div className="relative w-full h-full my-2 bg-slate-950/80 rounded-xl border border-slate-800 overflow-hidden">
                        {/* City Grid Lines */}
                        <svg className="w-full h-full absolute inset-0">
                          <line x1="25%" y1="0" x2="25%" y2="100%" stroke="#1e293b" strokeWidth="2" />
                          <line x1="65%" y1="0" x2="65%" y2="100%" stroke="#1e293b" strokeWidth="2" />
                          <line x1="0" y1="35%" x2="100%" y2="35%" stroke="#1e293b" strokeWidth="2" />
                          <line x1="0" y1="75%" x2="100%" y2="75%" stroke="#1e293b" strokeWidth="2" />

                          {/* Render Junction Nodes */}
                          {junctions.map(j => (
                            <g key={j.id}>
                              <circle cx={`${j.x}%`} cy={`${j.y}%`} r="18" fill={getStatusHex(j.status)} opacity="0.2" className="pulse-effect" />
                              <circle cx={`${j.x}%`} cy={`${j.y}%`} r="8" fill={getStatusHex(j.status)} stroke="#0f172a" strokeWidth="3" />
                              <text x={`${j.x + 2}%`} y={`${j.y - 2}%`} fill="#f8fafc" fontSize="11" fontWeight="bold">{j.id}</text>
                            </g>
                          ))}
                        </svg>
                      </div>
                    </div>

                    {/* Alerts Panel */}
                    <div className="space-y-4">
                      <div className="glass-panel p-4 rounded-2xl border border-slate-800">
                        <h3 className="text-sm font-bold text-white mb-3 flex justify-between">
                          <span>Active Congestion Alerts</span>
                          <span className="text-xs text-amber-400">{alerts.length} New</span>
                        </h3>
                        <div className="space-y-3 max-h-[380px] overflow-y-auto">
                          {alerts.map(a => (
                            <div key={a.id} className="p-3 rounded-xl bg-slate-900/80 border border-slate-800 text-xs space-y-1">
                              <div className="flex justify-between font-bold text-amber-400">
                                <span>{a.type}</span>
                                <span className="text-[10px] text-slate-500">{a.time}</span>
                              </div>
                              <div className="text-white font-medium">{a.junction}</div>
                              <div className="text-slate-400">{a.msg}</div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* PAGE 3: AI CONTROL */}
              {activeTab === 'ai-control' && (
                <div className="space-y-6 max-w-5xl mx-auto">
                  <h2 className="text-2xl font-bold text-white">AI Signal Recommendation Engine</h2>
                  <div className="glass-panel p-6 rounded-2xl border border-slate-800 space-y-6">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                      <div>
                        <h3 className="text-lg font-bold text-white">Target Node: Junction J-204</h3>
                        <p className="text-xs text-slate-400">Condition: High Northbound Density Spike</p>
                      </div>
                      <button
                        onClick={applyAiOptimization}
                        className={`px-5 py-2.5 rounded-xl font-bold text-xs ${
                          aiSignalApplied ? 'bg-emerald-950 text-emerald-400 border border-emerald-700' : 'bg-teal-500 text-slate-950 hover:bg-teal-400'
                        }`}
                      >
                        {aiSignalApplied ? '✓ AI Recommendation Applied' : 'Apply AI Optimization'}
                      </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs font-mono">
                      <div className="p-4 rounded-xl bg-slate-900 border border-slate-800 space-y-2">
                        <div className="text-slate-400 font-bold">DEFAULT TIMING</div>
                        <div>North Approach: 45s</div>
                        <div>East Approach: 30s</div>
                        <div>South Approach: 35s</div>
                        <div>West Approach: 25s</div>
                      </div>

                      <div className="p-4 rounded-xl bg-teal-950/40 border border-teal-500/40 space-y-2 text-teal-200">
                        <div className="text-teal-400 font-bold">AI RECOMMENDED TIMING</div>
                        <div>North Approach: <span className="font-bold text-emerald-400">65s (+20s)</span></div>
                        <div>East Approach: 20s</div>
                        <div>South Approach: 30s</div>
                        <div>West Approach: 20s</div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* PAGE 4: BUS PRIORITY */}
              {activeTab === 'bus-priority' && (
                <div className="space-y-6">
                  <h2 className="text-2xl font-bold text-white">Public Transit & Bus Priority</h2>
                  <div className="glass-panel rounded-2xl border border-slate-800 overflow-hidden">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-900 text-slate-400 border-b border-slate-800">
                        <tr>
                          <th className="p-3.5">Bus ID</th>
                          <th className="p-3.5">Route</th>
                          <th className="p-3.5">Heading</th>
                          <th className="p-3.5">ETA</th>
                          <th className="p-3.5">Delay</th>
                          <th className="p-3.5">Priority Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60">
                        {buses.map(b => (
                          <tr key={b.id} className="hover:bg-slate-800/40">
                            <td className="p-3.5 font-bold font-mono text-teal-300">{b.id}</td>
                            <td className="p-3.5 text-white">{b.line}</td>
                            <td className="p-3.5 text-slate-300">{b.headingJunction}</td>
                            <td className="p-3.5 font-mono">{b.eta}</td>
                            <td className="p-3.5 text-amber-400 font-bold">{b.delay}</td>
                            <td className="p-3.5">
                              <span className="px-2 py-1 rounded bg-teal-500/20 text-teal-300 font-bold border border-teal-500/30">
                                Active Priority Window (+18s)
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* OTHER TABS FALLBACK */}
              {(activeTab === 'route-opt' || activeTab === 'citizen-view' || activeTab === 'analytics') && (
                <div className="glass-panel p-8 rounded-2xl border border-slate-800 text-center space-y-4">
                  <h3 className="text-xl font-bold text-white">Module Operational</h3>
                  <p className="text-xs text-slate-400 max-w-md mx-auto">
                    FlowIQ adaptive routing, citizen commuter app view, and historical delay metric analytics are synchronized with the central telemetry engine.
                  </p>
                  <button onClick={() => setActiveTab('live-dashboard')} className="px-4 py-2 rounded-xl bg-teal-500 text-slate-950 font-bold text-xs">
                    Return to Live Command Center
                  </button>
                </div>
              )}

            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
