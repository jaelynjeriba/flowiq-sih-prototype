<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowIQ — AI-Powered Adaptive Traffic & Transit</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
              900: '#134e4a',
              950: '#042f2e',
            },
            dark: {
              bg: '#090d16',
              card: 'rgba(15, 23, 42, 0.75)',
              border: 'rgba(30, 41, 59, 0.8)',
              hover: '#1e293b'
            }
          },
          animation: {
            'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'radar-spin': 'spin 4s linear infinite',
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Recharts -->
  <script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090d16;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #0d9488;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.5);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.4);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    /* Pulsing map point effects */
    .pulse-ring {
      border: 3px solid rgba(239, 68, 68, 0.8);
      border-radius: 50%;
      height: 40px;
      width: 40px;
      position: absolute;
      left: -10px;
      top: -10px;
      animation: pulsate 1.5s ease-out infinite;
      opacity: 0;
    }
    @keyframes pulsate {
      0% { transform: scale(0.1); opacity: 0.0; }
      50% { opacity: 1.0; }
      100% { transform: scale(1.2); opacity: 0.0; }
    }
  </style>
</head>
<body class="bg-[#090d16] text-slate-100 antialiased selection:bg-teal-500 selection:text-white font-sans overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;
    const {
      LineChart, Line, AreaChart, Area, BarChart, Bar, XAxis, YAxis,
      CartesianGrid, Tooltip, ResponsiveContainer, Legend, PieChart, Pie, Cell
    } = window.Recharts;

    // --- MOCK INITIAL DATA SETS ---
    const INITIAL_JUNCTIONS = [
      { id: 'J-101', name: 'Connaught Circle / Central Ring', lat: 28.6315, lng: 77.2167, status: 'low', density: 34, vehicleCount: 142, avgSpeed: 42, waitTime: 18, signals: { N: 35, E: 30, S: 35, W: 30 }, cameraActive: true },
      { id: 'J-204', name: 'Tech Corridor - North Hub', lat: 28.6420, lng: 77.2280, status: 'severe', density: 89, vehicleCount: 480, avgSpeed: 11, waitTime: 82, signals: { N: 45, E: 30, S: 35, W: 25 }, cameraActive: true },
      { id: 'J-309', name: 'Metro Flyover Junction', lat: 28.6190, lng: 77.2100, status: 'moderate', density: 62, vehicleCount: 290, avgSpeed: 24, waitTime: 45, signals: { N: 40, E: 40, S: 30, W: 30 }, cameraActive: true },
      { id: 'J-108', name: 'Old City Outer Gate', lat: 28.6500, lng: 77.2350, status: 'low', density: 28, vehicleCount: 115, avgSpeed: 48, waitTime: 14, signals: { N: 30, E: 30, S: 30, W: 30 }, cameraActive: true },
      { id: 'J-502', name: 'IT Park Expressway Ramp', lat: 28.6250, lng: 77.2450, status: 'moderate', density: 68, vehicleCount: 340, avgSpeed: 21, waitTime: 52, signals: { N: 50, E: 25, S: 45, W: 20 }, cameraActive: true },
      { id: 'J-411', name: 'Harbor Link South Crossing', lat: 28.6050, lng: 77.2250, status: 'low', density: 22, vehicleCount: 98, avgSpeed: 52, waitTime: 12, signals: { N: 30, E: 30, S: 30, W: 30 }, cameraActive: true },
      { id: 'J-312', name: 'Central Hospital Boulevard', lat: 28.6380, lng: 77.2050, status: 'low', density: 31, vehicleCount: 130, avgSpeed: 45, waitTime: 16, signals: { N: 35, E: 35, S: 30, W: 30 }, cameraActive: true },
      { id: 'J-115', name: 'Stadium Roundabout', lat: 28.6120, lng: 77.2380, status: 'moderate', density: 58, vehicleCount: 265, avgSpeed: 28, waitTime: 38, signals: { N: 30, E: 45, S: 30, W: 45 }, cameraActive: true },
    ];

    const INITIAL_BUSES = [
      { id: 'BUS-401', line: 'Route 12B (Express)', lat: 28.6405, lng: 77.2260, headingJunction: 'J-204', eta: '4 min', delay: '+6 min', load: '84%', speed: 14, priorityActive: false },
      { id: 'BUS-108', line: 'Route 44 (Metro Feeder)', lat: 28.6300, lng: 77.2150, headingJunction: 'J-101', eta: '2 min', delay: 'On Time', load: '45%', speed: 38, priorityActive: false },
      { id: 'BUS-302', line: 'Route 9A (Outer Ring)', lat: 28.6220, lng: 77.2120, headingJunction: 'J-309', eta: '5 min', delay: '+2 min', load: '62%', speed: 26, priorityActive: false },
      { id: 'BUS-512', line: 'Route 101 (Airport Shuttle)', lat: 28.6240, lng: 77.2420, headingJunction: 'J-502', eta: '7 min', delay: '+9 min', load: '92%', speed: 18, priorityActive: true },
      { id: 'BUS-220', line: 'Route 31 (Civic Center)', lat: 28.6480, lng: 77.2320, headingJunction: 'J-108', eta: '3 min', delay: 'On Time', load: '30%', speed: 44, priorityActive: false }
    ];

    const ALERTS_DATA = [
      { id: 1, time: '2 mins ago', junction: 'J-204 (Tech Corridor)', type: 'Severe Congestion', msg: 'Vehicle queue exceeded 350 meters on Northbound ramp.', status: 'critical' },
      { id: 2, time: '5 mins ago', junction: 'J-502 (IT Park Ramp)', type: 'Flow Slowdown', msg: 'Average speed dropped by 45% due to sudden lane bottleneck.', status: 'warning' },
      { id: 3, time: '12 mins ago', junction: 'J-204', type: 'Bus Delay Priority', msg: 'BUS-401 requesting priority green window (60s extension).', status: 'info' }
    ];

    // Helper to calculate status colors
    const getStatusBg = (status) => {
      switch(status) {
        case 'severe': return 'bg-rose-500/20 text-rose-400 border-rose-500/40';
        case 'moderate': return 'bg-amber-500/20 text-amber-400 border-amber-500/40';
        default: return 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40';
      }
    };

    const getStatusHex = (status) => {
      switch(status) {
        case 'severe': return '#ef4444';
        case 'moderate': return '#f59e0b';
        default: return '#10b981';
      }
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      const [activeTab, setActiveTab] = useState('landing');
      const [junctions, setJunctions] = useState(INITIAL_JUNCTIONS);
      const [buses, setBuses] = useState(INITIAL_BUSES);
      const [alerts, setAlerts] = useState(ALERTS_DATA);
      const [isSurgeActive, setIsSurgeActive] = useState(false);
      const [surgeApplied, setSurgeApplied] = useState(false);
      const [aiSignalApplied, setAiSignalApplied] = useState(false);
      const [selectedTimeframe, setSelectedTimeframe] = useState('Today');
      const [currentTime, setCurrentTime] = useState(new Date());

      // Live Clock & Periodic Simulation Ticks
      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      // Dynamic Simulation Loop (updates small counts to show system is live)
      useEffect(() => {
        const simInterval = setInterval(() => {
          setJunctions(prev => prev.map(j => {
            // slightly fluctuate count & speed
            const delta = Math.floor(Math.random() * 7) - 3;
            const newCount = Math.max(30, j.vehicleCount + delta);
            return {
              ...j,
              vehicleCount: newCount,
              density: Math.min(99, Math.max(10, Math.round(newCount / 5)))
            };
          }));
        }, 3500);
        return () => clearInterval(simInterval);
      }, []);

      // Trigger Traffic Surge Simulation
      const triggerTrafficSurge = () => {
        setIsSurgeActive(true);
        setSurgeApplied(true);

        // Update Junction J-204 & J-309 to high severe states
        setJunctions(prev => prev.map(j => {
          if (j.id === 'J-204') {
            return {
              ...j,
              status: 'severe',
              density: 96,
              vehicleCount: 610,
              avgSpeed: 7,
              waitTime: 110,
              signals: { N: 45, E: 30, S: 35, W: 25 }
            };
          }
          if (j.id === 'J-309') {
            return {
              ...j,
              status: 'severe',
              density: 84,
              vehicleCount: 420,
              avgSpeed: 12,
              waitTime: 75
            };
          }
          return j;
        }));

        // Add Alert
        const surgeAlert = {
          id: Date.now(),
          time: 'Just now',
          junction: 'J-204 & J-309 Corridor',
          type: 'SURGE SIMULATED',
          msg: 'Sudden 220% traffic surge detected! Smart dynamic rerouting and adaptive signal timings recommended.',
          status: 'critical'
        };
        setAlerts(prev => [surgeAlert, ...prev]);

        // Auto navigate to AI Control after brief feedback
        setTimeout(() => {
          setActiveTab('ai-control');
        }, 1200);
      };

      const resetSurge = () => {
        setIsSurgeActive(false);
        setSurgeApplied(false);
        setAiSignalApplied(false);
        setJunctions(INITIAL_JUNCTIONS);
      };

      const applyAiOptimization = () => {
        setAiSignalApplied(true);
        // Optimize J-204 timing
        setJunctions(prev => prev.map(j => {
          if (j.id === 'J-204') {
            return {
              ...j,
              status: 'moderate',
              density: 54,
              avgSpeed: 28,
              waitTime: 32,
              signals: { N: 65, E: 20, S: 30, W: 20 }
            };
          }
          return j;
        }));

        setAlerts(prev => [{
          id: Date.now(),
          time: 'Just now',
          junction: 'J-204 (Tech Corridor)',
          type: 'AI Signal Applied',
          msg: 'Green light time extended on Northbound corridor by +20s. Queue clearing rate +42%.',
          status: 'info'
        }, ...prev]);
      };

      // Re-initialize Lucide Icons after render updates
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      return (
        <div className="min-h-screen flex flex-col bg-[#090d16] text-slate-100 font-sans">
          
          {/* HEADER / TOP BAR */}
          <header className="h-16 border-b border-slate-800 bg-[#090d16]/90 backdrop-blur-md sticky top-0 z-50 flex items-center justify-between px-4 md:px-6">
            <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('landing')}>
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-600 to-cyan-400 flex items-center justify-center shadow-lg shadow-teal-500/20">
                <i data-lucide="cpu" className="w-6 h-6 text-slate-950 font-bold"></i>
              </div>
              <div>
                <span className="text-xl font-extrabold tracking-wider bg-gradient-to-r from-teal-400 via-cyan-300 to-emerald-400 bg-clip-text text-transparent">
                  FlowIQ
                </span>
                <span className="hidden sm:inline-block text-[10px] ml-2 px-2 py-0.5 rounded bg-teal-950 text-teal-300 border border-teal-800 font-mono">
                  SIH 2026 PROTOTYPE
                </span>
              </div>
            </div>

            {/* Global Stats & Live Controls */}
            <div className="flex items-center space-x-3 md:space-x-6">
              <div className="hidden lg:flex items-center space-x-2 text-xs font-mono bg-slate-900/80 px-3 py-1.5 rounded-lg border border-slate-800">
                <span className="relative flex h-2 w-2">
                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <span className="text-slate-400">AI ENGINE:</span>
                <span className="text-emerald-400 font-semibold">ONLINE (v4.2-Adaptive)</span>
              </div>

              <div className="hidden md:flex items-center space-x-2 text-xs font-mono text-slate-400">
                <i data-lucide="clock" className="w-4 h-4 text-teal-400"></i>
                <span>{currentTime.toLocaleTimeString()}</span>
              </div>

              {/* SURGE DEMO BUTTON */}
              <button
                onClick={surgeApplied ? resetSurge : triggerTrafficSurge}
                className={`flex items-center space-x-2 text-xs font-bold px-3.5 py-2 rounded-lg transition-all duration-200 border ${
                  surgeApplied 
                    ? 'bg-rose-950/80 hover:bg-rose-900 text-rose-300 border-rose-700 shadow-lg shadow-rose-950/50' 
                    : 'bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-slate-950 border-amber-400 shadow-lg shadow-orange-500/20'
                }`}
              >
                <i data-lucide={surgeApplied ? "rotate-ccw" : "zap"} className="w-4 h-4 animate-bounce"></i>
                <span>{surgeApplied ? 'Reset Surge Simulation' : '⚡ SIMULATE TRAFFIC SURGE'}</span>
              </button>
            </div>
          </header>

          {/* MAIN LAYOUT */}
          <div className="flex flex-1 overflow-hidden">
            
            {/* SIDE NAVIGATION */}
            <aside className="w-16 md:w-64 border-r border-slate-800/80 bg-[#0c121e]/80 flex flex-col justify-between py-4 flex-shrink-0">
              <nav className="space-y-1 px-2">
                {[
                  { id: 'landing', label: 'Overview & Portal', icon: 'layout' },
                  { id: 'live-dashboard', label: 'Live Control Map', icon: 'map-pin' },
                  { id: 'ai-control', label: 'AI Signal Control', icon: 'sliders' },
                  { id: 'bus-priority', label: 'Bus Priority Hub', icon: 'bus' },
                  { id: 'route-opt', label: 'Dynamic Rerouting', icon: 'git-branch' },
                  { id: 'citizen-view', label: 'Citizen Commuter', icon: 'smartphone' },
                  { id: 'analytics', label: 'City Analytics', icon: 'bar-chart-3' },
                ].map((item) => {
                  const isActive = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setActiveTab(item.id)}
                      className={`w-full flex items-center space-x-3 px-3 py-3 rounded-xl text-xs md:text-sm font-medium transition-all duration-150 ${
                        isActive
                          ? 'bg-teal-500/15 text-teal-300 border border-teal-500/30 shadow-md shadow-teal-500/10'
                          : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'
                      }`}
                    >
                      <i data-lucide={item.icon} className={`w-5 h-5 ${isActive ? 'text-teal-400' : 'text-slate-400'}`}></i>
                      <span className="hidden md:inline">{item.label}</span>
                    </button>
                  );
                })}
              </nav>

              {/* SYSTEM STATUS CARD (SIDEBAR FOOTER) */}
              <div className="hidden md:block mx-3 p-3 rounded-xl bg-slate-900/90 border border-slate-800 text-xs">
                <div className="flex items-center justify-between text-slate-400 mb-2">
                  <span>Network Sync</span>
                  <span className="text-teal-400 font-mono">99.8%</span>
                </div>
                <div className="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                  <div className="bg-teal-400 h-full w-[99.8%] rounded-full"></div>
                </div>
                <p className="mt-2 text-[10px] text-slate-500">
                  Connecting 128 IoT Camera Nodes & 42 Transit Beacons.
                </p>
              </div>
            </aside>

            {/* MAIN CONTENT AREA */}
            <main className="flex-1 overflow-y-auto bg-gradient-to-b from-[#090d16] via-[#0d1322] to-[#090d16] p-4 md:p-6">
              
              {/* PAGE 1: LANDING PAGE OVERVIEW */}
              {activeTab === 'landing' && (
                <div className="space-y-10 max-w-7xl mx-auto">
                  {/* Hero Section */}
                  <div className="relative rounded-3xl glass-panel p-8 md:p-12 overflow-hidden border border-slate-700/50 shadow-2xl">
                    <div className="absolute -right-20 -top-20 w-96 h-96 bg-teal-500/10 rounded-full blur-3xl pointer-events-none"></div>
                    <div className="absolute -left-20 -bottom-20 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>

                    <div className="max-w-3xl relative z-10 space-y-6">
                      <div className="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-teal-500/10 border border-teal-500/30 text-teal-300 text-xs font-semibold">
                        <i data-lucide="sparkles" className="w-3.5 h-3.5"></i>
                        <span>Smart India Hackathon 2026 Core Solution</span>
                      </div>

                      <h1 className="text-4xl md:text-6xl font-black tracking-tight text-white leading-tight">
                        Smarter Traffic. <br />
                        <span className="bg-gradient-to-r from-teal-400 via-cyan-400 to-emerald-400 bg-clip-text text-transparent">
                          Faster Cities.
                        </span>
                      </h1>

                      <p className="text-slate-300 text-base md:text-lg leading-relaxed">
                        FlowIQ revolutionizes urban transportation with real-time video analytics, IoT density sensing, and AI-driven signal optimization. Reduce congestion bottlenecks, prioritize public transport, and lower carbon emissions dynamically.
                      </p>

                      <div className="flex flex-wrap gap-4 pt-2">
                        <button
                          onClick={() => setActiveTab('live-dashboard')}
                          className="px-6 py-3.5 rounded-xl bg-gradient-to-r from-teal-500 to-cyan-500 hover:from-teal-600 hover:to-cyan-600 text-slate-950 font-bold shadow-lg shadow-teal-500/25 flex items-center space-x-2 transition-transform active:scale-95"
                        >
                          <i data-lucide="activity" className="w-5 h-5"></i>
                          <span>Launch Live Dashboard</span>
                        </button>

                        <button
                          onClick={() => setActiveTab('ai-control')}
                          className="px-6 py-3.5 rounded-xl bg-slate-800/80 hover:bg-slate-800 text-slate-200 font-semibold border border-slate-700 flex items-center space-x-2 transition"
                        >
                          <i data-lucide="cpu" className="w-5 h-5 text-teal-400"></i>
                          <span>How FlowIQ Works</span>
                        </button>
                      </div>
                    </div>
                  </div>

                  {/* Impact Stats Grid */}
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                    {[
                      { title: 'Junctions Monitored', val: '128', icon: 'map-pin', detail: 'Live Camera & IoT Nodes' },
                      { title: 'Buses Tracked', val: '450+', icon: 'bus', detail: 'Real-time GPS priority' },
                      { title: 'Avg Delay Reduced', val: '28.4%', icon: 'trending-down', detail: 'Validated across peak hours' },
                      { title: 'CO2 Emission Saved', val: '14.2 Tons', icon: 'leaf', detail: 'Monthly estimated reduction' }
                    ].map((stat, idx) => (
                      <div key={idx} className="glass-card p-5 rounded-2xl border border-slate-800/80 space-y-2">
                        <div className="flex items-center justify-between text-slate-400">
                          <span className="text-xs font-medium">{stat.title}</span>
                          <i data-lucide={stat.icon} className="w-4 h-4 text-teal-400"></i>
                        </div>
                        <div className="text-2xl md:text-3xl font-black text-white">{stat.val}</div>
                        <p className="text-[11px] text-slate-500">{stat.detail}</p>
                      </div>
                    ))}
                  </div>

                  {/* System Architecture Explanation */}
                  <div className="glass-panel p-6 md:p-8 rounded-3xl border border-slate-800">
                    <h3 className="text-xl font-bold text-white mb-6 flex items-center space-x-2">
                      <i data-lucide="layers" className="w-5 h-5 text-teal-400"></i>
                      <span>4-Step Dynamic Traffic Intelligence Flow</span>
                    </h3>
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                      {[
                        { step: '01', title: 'Data Ingestion', desc: 'Consumes real-time video feed analytics, IoT inductive loop density, and bus GPS telemetry.' },
                        { step: '02', title: 'Predictive AI Model', desc: 'Predicts traffic queue formation 15–30 minutes in advance using temporal graph neural nets.' },
                        { step: '03', title: 'Adaptive Signals', desc: 'Dynamically shifts signal phase timings to balance high density approaches instantly.' },
                        { step: '04', title: 'Transit Priority & Reroute', desc: 'Grants green corridors for public buses and guides commuter apps to underused routes.' }
                      ].map((item, idx) => (
                        <div key={idx} className="relative p-5 rounded-2xl bg-slate-900/60 border border-slate-800/80">
                          <div className="text-3xl font-black text-teal-500/30 font-mono mb-2">{item.step}</div>
                          <div className="font-bold text-white mb-1">{item.title}</div>
                          <div className="text-xs text-slate-400 leading-relaxed">{item.desc}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* PAGE 2: LIVE TRAFFIC DASHBOARD */}
              {activeTab === 'live-dashboard' && (
                <div className="space-y-6">
                  {/* Top Control Header */}
                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                      <h2 className="text-2xl font-bold text-white flex items-center space-x-2">
                        <i data-lucide="activity" className="w-6 h-6 text-teal-400"></i>
                        <span>Live Command Center</span>
                      </h2>
                      <p className="text-xs text-slate-400">Real-time telemetry from smart city camera junctions & IoT loops.</p>
                    </div>

                    <div className="flex items-center space-x-3">
                      <div className="px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs flex items-center space-x-2">
                        <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span className="text-slate-300">Live Telemetry (3s Sync)</span>
                      </div>
                    </div>
                  </div>

                  {/* Main Grid: Map + Side Panel */}
                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    {/* Leaflet Map Component */}
                    <div className="lg:col-span-2 glass-panel rounded-2xl overflow-hidden border border-slate-800 h-[520px] relative flex flex-col">
                      <div className="p-3 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between">
                        <span className="text-xs font-semibold text-slate-300 flex items-center space-x-2">
                          <i data-lucide="map" className="w-4 h-4 text-teal-400"></i>
                          <span>Citywide Junction Density & Signal Map</span>
                        </span>
                        <div className="flex items-center space-x-3 text-xs">

                            <CartesianGrid strokeDasharray="3 3" stroke="#1e293b" />
                            <XAxis dataKey="time" stroke="#64748b" />
                            <YAxis stroke="#64748b" />
                            <Tooltip contentStyle={{ backgroundColor: '#0f172a', borderColor: '#334155' }} />
                            <Area type="monotone" dataKey="traditional" name="Static Timer" stroke="#ef4444" fill="#ef4444" fillOpacity={0.15} />
                            <Area type="monotone" dataKey="flowiq" name="FlowIQ Adaptive" stroke="#14b8a6" fill="#14b8a6" fillOpacity={0.25} />
                          </AreaChart>
                        </ResponsiveContainer>
                      </div>
                    </div>

                    {/* Bus Punctuality Trend Chart */}
                    <div className="glass-panel p-5 rounded-2xl border border-slate-800 space-y-3">
                      <h3 className="text-sm font-bold text-white flex items-center justify-between">
                        <span>Public Bus On-Time Punctuality (%)</span>
                        <span className="text-xs text-emerald-400 font-mono">91.8% Target Met</span>
                      </h3>
                      <div className="h-64">
                        <ResponsiveContainer width="100%" height="100%">
                          <LineChart data={[
                            { day: 'Mon', punctuality: 74 },
                            { day: 'Tue', punctuality: 81 },
                            { day: 'Wed', punctuality: 86 },
                            { day: 'Thu', punctuality: 89 },
                            { day: 'Fri', punctuality: 92 },
                            { day: 'Sat', punctuality: 95 },
                            { day: 'Sun', punctuality: 97 },
                          ]}>
                            <CartesianGrid strokeDasharray="3 3" stroke="#1e293b" />
                            <XAxis dataKey="day" stroke="#64748b" />
                            <YAxis stroke="#64748b" domain={[50, 100]} />
                            <Tooltip contentStyle={{ backgroundColor: '#0f172a', borderColor: '#334155' }} />
                            <Line type="monotone" dataKey="punctuality" name="Punctuality %" stroke="#38bdf8" strokeWidth={3} dot={{ fill: '#38bdf8' }} />
                          </LineChart>
                        </ResponsiveContainer>
                      </div>
                    </div>
                  </div>
                </div>
              )}

            </main>
          </div>
        </div>
      );
    }

    // --- LEAFLET INTERACTIVE MAP COMPONENT ---
    function InteractiveMap({ junctions, buses }) {
      const mapContainerRef = useRef(null);
      const leafletMapRef = useRef(null);
      const markersRef = useRef({});

      useEffect(() => {
        if (!mapContainerRef.current) return;

        // Initialize Map centered around city coordinates if not created
        if (!leafletMapRef.current) {
          const map = L.map(mapContainerRef.current, {
            center: [28.6300, 77.2200],
            zoom: 13,
            zoomControl: false,
            attributionControl: false
          });

          // Dark control-center styled map tiles (CartoDB Dark Matter)
          L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            subdomains: 'abcd',
          }).addTo(map);

          leafletMapRef.current = map;
        }

        const map = leafletMapRef.current;

        // Render / Update Junction Markers
        junctions.forEach(j => {
          const colorHex = getStatusHex(j.status);
          const iconHtml = `
            <div style="position: relative;">
              ${j.status === 'severe' ? '<div class="pulse-ring"></div>' : ''}
              <div style="
                background-color: ${colorHex};
                width: 18px;
                height: 18px;
                border-radius: 50%;
                border: 3px solid #0f172a;
                box-shadow: 0 0 12px ${colorHex};
              "></div>
            </div>
          `;

          const customIcon = L.divIcon({
            html: iconHtml,
            className: 'custom-leaflet-icon',
            iconSize: [20, 20],
            iconAnchor: [10, 10]
          });

          if (markersRef.current[j.id]) {
            markersRef.current[j.id].setLatLng([j.lat, j.lng]);
            markersRef.current[j.id].setIcon(customIcon);
          } else {
            const marker = L.marker([j.lat, j.lng], { icon: customIcon }).addTo(map);
            marker.bindPopup(`
              <div style="background:#0f172a; color:#fff; padding:6px; font-family:sans-serif; border-radius:8px;">
                <strong style="color:#2dd4bf;">${j.id}: ${j.name}</strong><br/>
                <span>Density: <b>${j.density}%</b></span><br/>
                <span>Vehicles: <b>${j.vehicleCount} veh/h</b></span><br/>
                <span>Avg Speed: <b>${j.avgSpeed} km/h</b></span>
              </div>
            `);
            markersRef.current[j.id] = marker;
          }
        });

      }, [junctions, buses]);

      return <div ref={mapContainerRef} className="w-full h-full min-h-[460px] z-10"></div>;
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
